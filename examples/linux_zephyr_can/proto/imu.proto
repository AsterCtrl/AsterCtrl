syntax = "proto3";

package aster.examples.can.v1;

message ImuState {
  uint64 timestamp_us = 1;
  repeated float quaternion = 2;
  bytes status = 3;
}

message CalibrationRequest {
  uint32 sensor_id = 1;
}

message CalibrationResponse {
  uint32 revision = 1;
  bool valid = 2;
}

service Sensor {
  rpc ReadCalibration(CalibrationRequest) returns (CalibrationResponse);
}
