api_version: aster.dev/v1alpha2
kind: Module
metadata:
  name: state-sink
  version: 0.1.0
spec:
  implementation:
    target: linux_local_demo
    class: ::examples::StateSink
    header: examples/state_sink.hpp
  platforms: [linux]
  ports:
    - name: state
      kind: subscriber
      type: aster.examples.local.v1.State
      max_rate_hz: 20
  tasks:
    - name: consume
      domain: main
      stack_bytes: 1024
      queue_depth: 4
      priority: 9
