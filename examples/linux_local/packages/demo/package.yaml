api_version: aster.dev/v1alpha2
kind: Package
metadata:
  name: demo
  version: 0.1.0
  license: Apache-2.0
spec:
  build:
    system: cmake
    target: linux_local_demo
  exports:
    modules:
      - state-source.module.yaml
      - state-sink.module.yaml
    protos:
      - ../../proto/state.proto
  protobuf:
    bounds: ../../proto/bounds.yaml
    includes: [../../proto]
  dependencies: {}
