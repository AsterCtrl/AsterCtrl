name: Release v0.2 alpha

on:
  push:
    tags:
      - v0.2.0-alpha.*

permissions:
  checks: read
  contents: read

env:
  UV_FROZEN: "true"
  UV_NO_PROGRESS: "true"

jobs:
  verify:
    name: Verify alpha-only release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Reject final or malformed release tags
        run: python3 scripts/ci/verify_alpha_tag.py "${GITHUB_REF_NAME}"
      - name: Require the tag to point at the current main commit
        run: |
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Require all main-branch gates to have succeeded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          checks=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            --jq '.check_runs[] | [.name, .conclusion] | @tsv')
          while IFS= read -r required; do
            if ! awk -F '\t' -v name="$required" \
              '$1 == name && $2 == "success" { found = 1 } END { exit !found }' \
              <<< "$checks"; then
              echo "required successful check is missing: $required" >&2
              exit 1
            fi
          done <<'EOF'
          Python, graphs, and bounded protobuf
          Host gcc
          Host clang-18
          Linux x86_64
          Linux arm64
          Clang 18 format and tidy
          ASan and UBSan
          TSan
          Sphinx documentation
          Dependency pins and licenses
          Secret scan
          Source SBOM
          Zephyr 4.4 runtime and boards
          EOF

  host-artifacts:
    name: Linux ${{ matrix.architecture }} artifact
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tools
        run: |
          sudo apt-get update
          kernel_release=$(uname -r)
          sudo apt-get install --yes cmake g++ iproute2 kmod ninja-build \
            "linux-modules-extra-${kernel_release}"
      - name: Build and test
        run: |
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DASTER_BUILD_TESTS=ON
          cmake --build build/release --parallel 2
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set dev vcan0 up
          ASTER_TEST_VCAN=vcan0 ctest --test-dir build/release --output-on-failure --timeout 30
      - name: Stage versioned Linux package
        run: |
          package="asterctrl-${GITHUB_REF_NAME}-linux-${{ matrix.architecture }}"
          cmake --install build/release --prefix "build/package/$package"
          cp LICENSE README.md "build/package/$package/"
          cp -R schemas "build/package/$package/"
          tar -C build/package -czf "build/$package.tar.gz" "$package"
      - name: Upload Linux package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.architecture }}
          path: build/asterctrl-*.tar.gz
          if-no-files-found: error

  metadata:
    name: Schemas, locks, logs, and rollback
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.9"
      - name: Install protoc and locked Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++ protobuf-compiler
          uv sync --frozen --all-groups
      - name: Re-run graph and bounded protobuf acceptance
        run: |
          uv run --package aster-cli pytest tests/cli
          uv run python scripts/ci/check_examples.py
      - name: Generate deterministic release locks
        run: |
          mkdir -p build/metadata/locks
          uv run aster package lock examples/linux_local/workspace.yaml --release --output build/metadata/locks/linux-local.package.lock.yaml
          uv run aster package lock examples/linux_zephyr_can/workspace.yaml --release --output build/metadata/locks/linux-zephyr-can.package.lock.yaml
          uv run aster package lock examples/linux_zephyr_usb_cdc/workspace.yaml --release --output build/metadata/locks/linux-zephyr-usb-cdc.package.lock.yaml
          uv run aster package lock examples/provider_swap/workspace.sim.yaml --release --output build/metadata/locks/provider-sim.package.lock.yaml
          uv run aster package lock examples/provider_swap/workspace.real.yaml --release --output build/metadata/locks/provider-real.package.lock.yaml
          uv run aster resolve examples/linux_local/workspace.yaml examples/linux_local/deployment.yaml --release --output build/metadata/locks/linux-local.deployment.lock.yaml
          uv run aster resolve examples/linux_zephyr_can/workspace.yaml examples/linux_zephyr_can/deployment.yaml --release --output build/metadata/locks/linux-zephyr-can.deployment.lock.yaml
          uv run aster resolve examples/linux_zephyr_usb_cdc/workspace.yaml examples/linux_zephyr_usb_cdc/deployment.yaml --release --output build/metadata/locks/linux-zephyr-usb-cdc.deployment.lock.yaml
          uv run aster resolve examples/provider_swap/workspace.sim.yaml examples/provider_swap/deployment.sim.yaml --release --output build/metadata/locks/provider-sim.deployment.lock.yaml
          uv run aster resolve examples/provider_swap/workspace.real.yaml examples/provider_swap/deployment.real.yaml --release --output build/metadata/locks/provider-real.deployment.lock.yaml
      - name: Package release metadata
        run: |
          cp -R schemas build/metadata/
          cp CHANGELOG.md build/metadata/
          cp scripts/ci/ROLLBACK.md build/metadata/
          cp scripts/ci/alpha-release-notes.md build/metadata/RELEASE_NOTES.md
          cp -R document/development build/metadata/development-log
          cp west.yml uv.lock build/metadata/
          tar -C build -czf "build/asterctrl-${GITHUB_REF_NAME}-metadata.tar.gz" metadata
      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: build/asterctrl-*-metadata.tar.gz
          if-no-files-found: error

  zephyr-artifacts:
    name: Zephyr compile-only firmware
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source as the west manifest repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: asterctrl
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.9"
      - name: Prepare Zephyr 4.4.0 and SDK 1.0.1
        uses: zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a # v1
        with:
          app-path: asterctrl
          sdk-version: "1.0.1"
          toolchains: arm-zephyr-eabi:x86_64-zephyr-elf
          west-version: "1.5.0"
      - name: Materialize code generator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler
          uv sync --project asterctrl --frozen --all-groups
      - name: Run simulated Runtime smoke tests
        run: >-
          west twister
          -T asterctrl/scripts/ci/zephyr_smoke
          -p native_sim
          -p qemu_cortex_m3
          --inline-logs
          --integration
          --extra-args="ZEPHYR_EXTRA_MODULES=$PWD/asterctrl"
      - name: Build board firmware
        run: |
          west build -p always -b dev_c/stm32f407xx -d build/dev_c asterctrl/scripts/ci/zephyr_smoke -- -DZEPHYR_EXTRA_MODULES="$PWD/asterctrl"
          west build -p always -b mc02/stm32h723xx -d build/mc02 asterctrl/scripts/ci/zephyr_smoke -- -DZEPHYR_EXTRA_MODULES="$PWD/asterctrl"
          python3 asterctrl/scripts/ci/check_zephyr_size.py build/dev_c/zephyr/zephyr.elf --max-flash 524288 --max-ram 98304
          python3 asterctrl/scripts/ci/check_zephyr_size.py build/mc02/zephyr/zephyr.elf --max-flash 524288 --max-ram 262144
      - name: Build generated CAN and USB nodes
        run: |
          uv run --project asterctrl aster codegen asterctrl/examples/linux_zephyr_can/workspace.yaml asterctrl/examples/linux_zephyr_can/deployment.yaml build/generated/can --release
          uv run --project asterctrl aster codegen asterctrl/examples/linux_zephyr_usb_cdc/workspace.yaml asterctrl/examples/linux_zephyr_usb_cdc/deployment.yaml build/generated/usb --release
          west build -p always -b dev_c/stm32f407xx -d build/generated-can asterctrl/examples/linux_zephyr_can -- -DZEPHYR_EXTRA_MODULES="$PWD/asterctrl" -DASTER_ZEPHYR_BUILD=ON -DASTER_GENERATED_DIR="$PWD/build/generated/can/nodes/sensor-node" -DEXTRA_CONF_FILE="$PWD/build/generated/can/nodes/sensor-node/aster.generated.conf" -DDTC_OVERLAY_FILE="$PWD/build/generated/can/nodes/sensor-node/aster.generated.overlay"
          west build -p always -b dev_c/stm32f407xx -d build/generated-usb asterctrl/examples/linux_zephyr_usb_cdc -- -DZEPHYR_EXTRA_MODULES="$PWD/asterctrl" -DASTER_ZEPHYR_BUILD=ON -DASTER_GENERATED_DIR="$PWD/build/generated/usb/nodes/actuator-node" -DEXTRA_CONF_FILE="$PWD/build/generated/usb/nodes/actuator-node/aster.generated.conf" -DDTC_OVERLAY_FILE="$PWD/build/generated/usb/nodes/actuator-node/aster.generated.overlay"
          python3 asterctrl/scripts/ci/check_zephyr_size.py build/generated-can/zephyr/zephyr.elf --max-flash 524288 --max-ram 98304
          python3 asterctrl/scripts/ci/check_zephyr_size.py build/generated-usb/zephyr/zephyr.elf --max-flash 524288 --max-ram 98304
      - name: Package firmware with resolved manifest
        run: |
          package="asterctrl-${GITHUB_REF_NAME}-zephyr-compile-only"
          for image in dev_c mc02 generated-can generated-usb; do
            mkdir -p "build/package/$package/$image"
            cp build/$image/zephyr/zephyr.elf "build/package/$package/$image/"
            cp build/$image/zephyr/zephyr.hex "build/package/$package/$image/"
            cp build/$image/zephyr/zephyr.bin "build/package/$package/$image/"
            arm-zephyr-eabi-size build/$image/zephyr/zephyr.elf > "build/package/$package/$image/size.txt"
          done
          west manifest --freeze --active-only > "build/package/$package/west-frozen.yml"
          tar -C build/package -czf "build/$package.tar.gz" "$package"
      - name: Upload Zephyr firmware package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zephyr-firmware
          path: build/asterctrl-*-zephyr-compile-only.tar.gz
          if-no-files-found: error

  sbom:
    name: Release SBOM
    needs:
      - host-artifacts
      - metadata
      - zephyr-artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download packaged release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-inputs
          merge-multiple: true
      - name: Generate CycloneDX SBOM for packaged inputs
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: release-inputs
          format: cyclonedx-json
          output-file: asterctrl-${{ github.ref_name }}.cdx.json
          artifact-name: release-sbom
          syft-version: v1.51.1
          upload-release-assets: false

  publish:
    name: Publish GitHub prerelease
    needs:
      - host-artifacts
      - metadata
      - zephyr-artifacts
      - sbom
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        run: |
          checksum_file=$(mktemp)
          cd release-assets
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > "$checksum_file"
          mv "$checksum_file" SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish immutable alpha assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: scripts/ci/alpha-release-notes.md
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: release-assets/*
