[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aster-cli"
version = "0.2.0a1"
description = "Typed graph compiler and bounded code generator for AsterCtrl"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "jsonschema>=4.23,<5",
  "protobuf>=5.29,<7",
  "PyYAML>=6,<7",
  "referencing>=0.36,<1",
]

[project.scripts]
aster = "aster_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aster_cli = ["schemas/*.json", "py.typed"]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["../../tests/cli"]
